<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SVS – Approvals</title>
  <link rel="stylesheet" href="svs.css" />
</head>
<body>
  <div id="svs-nav"></div>
  <div class="wrap wrap-narrow">
    <h1>Approvals</h1>
    <div id="who" class="muted"></div>
    <div class="card coming">Perform-action approvals (publish, submit, overwrite master, reopen) — coming in this build.</div>
  </div>
  <script type="module" src="svs-nav.js"></script>
  <script type="module">
    import { requireSessionOrRedirect } from "./app.js";
    const session = await requireSessionOrRedirect();
    document.getElementById("who").textContent = "Signed in: " + session.user.email;
  </script>
</body>
</html>
