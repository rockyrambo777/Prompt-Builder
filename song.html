<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SVS – Song</title>
  <link rel="stylesheet" href="svs.css" />
</head>
<body>
  <div id="svs-nav"></div>
  <div class="wrap wrap-narrow">
    <div class="top">
      <div>
        <h1 id="pageTitle">Song</h1>
        <div id="crumb" class="muted"></div>
        <div id="who" class="muted"></div>
      </div>
      <div class="row">
        <button id="btnCopyLyrics" class="btn copy-lg">COPY LYRICS</button>
        <button id="btnCopySuno" class="btn copy-lg">COPY SUNO PROMPT</button>
        <button id="btnSave" class="btn primary">Save</button>
      </div>
    </div>
    <div id="msg" class="msg muted"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="music">MUSIC</button>
      <button class="tab" data-tab="long">LONG VIDEO</button>
      <button class="tab" data-tab="shorts">SHORTS</button>
      <button class="tab" data-tab="community">COMMUNITY</button>
      <button class="tab" data-tab="distro">DISTRIBUTION</button>
      <button class="tab" data-tab="youtube">YOUTUBE</button>
    </div>

    <div id="panel-music" class="tab-panel active"></div>
    <div id="panel-long" class="tab-panel"><div class="card coming">Long video packages and scenes — coming in this build.</div></div>
    <div id="panel-shorts" class="tab-panel"><div class="card coming">Shorts packages — coming in this build.</div></div>
    <div id="panel-community" class="tab-panel"><div class="card coming">Community posts — coming in this build.</div></div>
    <div id="panel-distro" class="tab-panel"><div class="card coming">Distribution — coming in this build.</div></div>
    <div id="panel-youtube" class="tab-panel"><div class="card coming">YouTube inventory — coming in this build.</div></div>
  </div>

  <script type="module" src="svs-nav.js"></script>
  <script type="module">
    import { supabase, requireSessionOrRedirect } from "./app.js";
    import { mountPackageTabs } from "./svs-song-tabs.js";
    import { formatSunoLyrics } from "./suno-format.js";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const songId = (params.get("id") || "").trim() || null;

    const session = await requireSessionOrRedirect();
    $("who").textContent = "Signed in: " + session.user.email;

    const SAVE_KEYS = [
      "lyrics", "suno_prompt", "suno_share_url", "keywords", "scripture",
      "title", "track_number", "persona_id", "theme", "production_status",
      "wav_drive_url", "mp3_drive_url", "edit_notes"
    ];
    const CATALOGUE_KEYS = [
      "official_release_date", "isrc", "youtube_video_id", "youtube_url", "youtube_published_at"
    ];

    function safe(v) { return (v === null || v === undefined) ? "" : String(v); }
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function knownHas(row, key) { return row && Object.prototype.hasOwnProperty.call(row, key); }
    function val(id) { const n = $(id); return n ? n.value : ""; }

    async function copyText(text, btn) {
      const t = text || "";
      try { await navigator.clipboard.writeText(t); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      if (btn) {
        const old = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = old; }, 1200);
      }
    }

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        const panel = $("panel-" + btn.dataset.tab);
        if (panel) panel.classList.add("active");
      };
    });

    if (!songId) {
      $("msg").textContent = "Open a song from an album (missing ?id=).";
      $("btnSave").style.display = "none";
    }

    let songRow = null;
    let albumRow = null;
    let artistRow = null;

    async function loadPersonas(artistId) {
      const { data, error } = await supabase
        .from("artists_personas")
        .select("id,label,is_active")
        .eq("artists_id", artistId)
        .order("label");
      if (error) return [];
      return (data || []).filter((p) => p.is_active !== false);
    }

    async function loadFinalSuno(song) {
      const { data, error } = await supabase
        .from("suno_versions")
        .select("id,suno_share_url,is_selected_final,label")
        .eq("song_id", song.id)
        .eq("is_selected_final", true)
        .maybeSingle();
      if (error) return { url: song.suno_share_url || "", checked: false, table: false };
      if (data) return { url: data.suno_share_url || song.suno_share_url || "", checked: true, table: true };
      return { url: song.suno_share_url || "", checked: false, table: true };
    }
    async function loadSunoVersions(song) {
      let q = await supabase
        .from("suno_versions")
        .select("id,suno_share_url,is_selected_final,label,generated_at,created_at")
        .eq("song_id", song.id)
        .order("created_at", { ascending: true });
      if (q.error) {
        q = await supabase
          .from("suno_versions")
          .select("id,suno_share_url,is_selected_final,label,created_at")
          .eq("song_id", song.id)
          .order("created_at", { ascending: true });
      }
      if (q.error) return { rows: [], table: false };
      return { rows: q.data || [], table: true };
    }

    function fieldInput(label, id, value, extra) {
      const wrap = el("label", "field");
      wrap.appendChild(el("span", "", label));
      const input = document.createElement(extra?.tag || "input");
      input.id = id;
      if (extra?.tag === "textarea") {
        input.value = safe(value);
        if (extra.cls) input.className = extra.cls;
      } else {
        input.type = extra?.type || "text";
        input.value = safe(value);
      }
      wrap.appendChild(input);
      return wrap;
    }

    async function loadSong() {
      if (!songId) return;
      $("msg").textContent = "Loading song…";

      const { data: song, error } = await supabase.from("songs").select("*").eq("id", songId).maybeSingle();
      if (error) { $("msg").textContent = "Error: " + error.message; return; }
      if (!song) { $("msg").textContent = "Song not found."; return; }
      songRow = song;

      const { data: album } = await supabase.from("albums").select("*").eq("id", song.album_id).maybeSingle();
      albumRow = album || {};
      const { data: artist } = albumRow.artist_id
        ? await supabase.from("artists").select("*").eq("id", albumRow.artist_id).maybeSingle()
        : { data: null };
      artistRow = artist || {};

      $("pageTitle").textContent = safe(song.title) || "Song";
      const crumb = [];
      if (artistRow.name) crumb.push(artistRow.name);
      if (albumRow.title) crumb.push(albumRow.title);
      if (song.track_number != null) crumb.push("Track " + song.track_number);
      $("crumb").innerHTML = "";
      if (albumRow.id) {
        const a = document.createElement("a");
        a.className = "link";
        a.href = "./album.html?id=" + encodeURIComponent(albumRow.id);
        a.textContent = crumb.join(" · ") || "Album";
        $("crumb").appendChild(a);
      } else {
        $("crumb").textContent = crumb.join(" · ");
      }

      const personas = albumRow.artist_id ? await loadPersonas(albumRow.artist_id) : [];
      const finalSuno = await loadFinalSuno(song);
      const sunoVers = await loadSunoVersions(song);

      const panel = $("panel-music");
      panel.innerHTML = "";
      const card = el("div", "card");
      card.appendChild(el("h2", "", "Music"));

      const grid = el("div", "form-grid");
      grid.appendChild(fieldInput("Track number", "f_track_number", song.track_number, { type: "number" }));
      grid.appendChild(fieldInput("Title", "f_title", song.title));

      const personaF = el("label", "field");
      personaF.appendChild(el("span", "", "Persona"));
      if (personas.length) {
        const sel = document.createElement("select");
        sel.id = "f_persona_id";
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Default (artist DNA)";
        sel.appendChild(empty);
        for (const p of personas) {
          const o = document.createElement("option");
          o.value = p.id;
          o.textContent = p.label || "Persona";
          if (song.persona_id === p.id) o.selected = true;
          sel.appendChild(o);
        }
        personaF.appendChild(sel);
      } else {
        personaF.appendChild(el("div", "muted", "No personas on this artist."));
        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.id = "f_persona_id";
        hidden.value = safe(song.persona_id);
        personaF.appendChild(hidden);
      }
      grid.appendChild(personaF);
      grid.appendChild(fieldInput("Production status", "f_production_status", song.production_status));
      card.appendChild(grid);

      card.appendChild(fieldInput("Theme", "f_theme", song.theme, { tag: "textarea" }));
      card.appendChild(fieldInput("Keywords", "f_keywords", song.keywords, { tag: "textarea" }));
      card.appendChild(fieldInput("Scripture", "f_scripture", song.scripture, { tag: "textarea" }));
      card.appendChild(fieldInput("Human notes", "f_edit_notes", song.edit_notes, { tag: "textarea" }));
      card.appendChild(fieldInput("Lyrics", "f_lyrics", song.lyrics, { tag: "textarea", cls: "lyrics" }));
      card.appendChild(fieldInput("Suno prompt", "f_suno_prompt", song.suno_prompt, { tag: "textarea", cls: "prompt" }));
      card.appendChild(fieldInput("Suno share URL", "f_suno_share_url", song.suno_share_url || finalSuno.url));
      card.appendChild(el("div", "hint", "Suno generated dates are not official release dates. Do not merge Suno dates into official_release_date. Recon does not auto-pick a selected final."));

      const finalBox = el("label", "field");
      finalBox.appendChild(el("span", "", "Selected final"));
      const row = el("div", "row");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = "f_is_selected_final";
      cb.checked = !!finalSuno.checked;
      const cbLab = el("span", "muted", "This share URL is the selected final version");
      row.appendChild(cb);
      row.appendChild(cbLab);
      finalBox.appendChild(row);
      const finalUrl = document.createElement("input");
      finalUrl.type = "text";
      finalUrl.id = "f_final_suno_url";
      finalUrl.value = safe(finalSuno.url || song.suno_share_url);
      finalUrl.placeholder = "Selected final Suno URL";
      finalUrl.style.marginTop = "8px";
      finalBox.appendChild(finalUrl);
      card.appendChild(finalBox);

      if (sunoVers.table) {
        const versCard = el("div", "field");
        versCard.appendChild(el("span", "", "Suno versions"));
        if (!sunoVers.rows.length) {
          versCard.appendChild(el("div", "muted", "No suno_versions rows yet."));
        } else {
          const table = el("table", "data");
          table.innerHTML = "<thead><tr><th>Label</th><th>URL</th><th>Selected final</th></tr></thead>";
          const tb = document.createElement("tbody");
          for (const v of sunoVers.rows) {
            const tr = document.createElement("tr");
            const url = safe(v.suno_share_url);
            const urlHtml = url
              ? "<a class='link' href='" + url.replace(/'/g, "") + "' target='_blank' rel='noopener'>" + url + "</a>"
              : "";
            tr.innerHTML =
              "<td>" + safe(v.label || "") + "</td>" +
              "<td>" + urlHtml + "</td>" +
              "<td>" + (v.is_selected_final ? "yes" : "") + "</td>";
            tb.appendChild(tr);
          }
          table.appendChild(tb);
          versCard.appendChild(table);
        }
        card.appendChild(versCard);
      }

      const drive = el("div", "form-grid");
      drive.appendChild(fieldInput("WAV Drive URL", "f_wav_drive_url", song.wav_drive_url));
      drive.appendChild(fieldInput("MP3 Drive URL", "f_mp3_drive_url", song.mp3_drive_url));
      card.appendChild(drive);

      const catKeysPresent = CATALOGUE_KEYS.filter((k) => knownHas(song, k));
      if (catKeysPresent.length) {
        card.appendChild(el("div", "hint", "Official music dates are not YouTube publish dates and not Suno generated dates. These fields are stored separately and never copied into each other on save."));
        const cat = el("div", "form-grid");
        if (knownHas(song, "official_release_date")) {
          cat.appendChild(fieldInput("Official release date", "f_official_release_date", song.official_release_date ? String(song.official_release_date).slice(0, 10) : "", { type: "date" }));
        }
        if (knownHas(song, "isrc")) cat.appendChild(fieldInput("ISRC", "f_isrc", song.isrc));
        if (knownHas(song, "youtube_video_id")) cat.appendChild(fieldInput("YouTube video id", "f_youtube_video_id", song.youtube_video_id));
        if (knownHas(song, "youtube_url")) cat.appendChild(fieldInput("YouTube URL", "f_youtube_url", song.youtube_url));
        if (knownHas(song, "youtube_published_at")) {
          cat.appendChild(fieldInput("YouTube published at", "f_youtube_published_at", song.youtube_published_at));
        }
        card.appendChild(cat);
        for (const k of catKeysPresent) {
          if (!SAVE_KEYS.includes(k)) SAVE_KEYS.push(k);
        }
      }

      panel.appendChild(card);
      $("msg").textContent = "Loaded.";
    }

    async function maybeSaveSunoFinal(song, shareUrl, isFinal, finalUrl) {
      const url = (finalUrl || shareUrl || "").trim();
      const { error: probe } = await supabase.from("suno_versions").select("id").eq("song_id", song.id).limit(1);
      if (probe) return;
      if (!isFinal || !url) return;
      await supabase.from("suno_versions").update({ is_selected_final: false }).eq("song_id", song.id);
      const { data: existing } = await supabase
        .from("suno_versions")
        .select("id")
        .eq("song_id", song.id)
        .eq("suno_share_url", url)
        .maybeSingle();
      if (existing) {
        await supabase.from("suno_versions").update({ is_selected_final: true }).eq("id", existing.id);
      } else {
        await supabase.from("suno_versions").insert({
          song_id: song.id,
          suno_share_url: url,
          is_selected_final: true,
          label: "final",
          created_by: "human"
        });
      }
    }

    async function saveSong() {
      if (!songRow) return;
      $("msg").textContent = "Saving…";
      $("msg").className = "msg muted";

      const raw = {
        lyrics: val("f_lyrics"),
        suno_prompt: val("f_suno_prompt"),
        suno_share_url: val("f_suno_share_url"),
        keywords: val("f_keywords"),
        scripture: val("f_scripture"),
        title: val("f_title"),
        track_number: val("f_track_number") === "" ? null : Number(val("f_track_number")),
        persona_id: val("f_persona_id") || null,
        theme: val("f_theme"),
        production_status: val("f_production_status"),
        wav_drive_url: val("f_wav_drive_url"),
        mp3_drive_url: val("f_mp3_drive_url"),
        edit_notes: val("f_edit_notes"),
        official_release_date: val("f_official_release_date") || null,
        isrc: val("f_isrc"),
        youtube_video_id: val("f_youtube_video_id"),
        youtube_url: val("f_youtube_url"),
        youtube_published_at: val("f_youtube_published_at") || null,
      };
      // Never copy youtube_published_at or Suno generated_at into official_release_date (or the reverse).
      const payload = {};
      for (const k of SAVE_KEYS) {
        if (knownHas(songRow, k)) {
          let v = raw[k];
          if (v === "") v = null;
          payload[k] = v;
        }
      }
      if (knownHas(songRow, "lyrics_done") && knownHas(songRow, "lyrics")) {
        payload.lyrics_done = !!(payload.lyrics && String(payload.lyrics).trim());
      }
      // official_release_date and youtube_published_at stay on their own keys; never assign one from the other.

      let q = supabase.from("songs").update(payload).eq("id", songRow.id);
      if (knownHas(songRow, "version")) {
        payload.version = (songRow.version || 1) + 1;
        if (knownHas(songRow, "updated_at")) payload.updated_at = new Date().toISOString();
        q = supabase.from("songs").update(payload).eq("id", songRow.id).eq("version", songRow.version);
      }
      const { data, error } = await q.select("*");
      if (error) {
        $("msg").textContent = "Save failed: " + error.message;
        $("msg").className = "msg error";
        return;
      }
      if (knownHas(songRow, "version") && (!data || !data.length)) {
        $("msg").textContent = "Someone else saved this song. Refresh, then save again.";
        $("msg").className = "msg error";
        return;
      }
      songRow = (data && data[0]) || songRow;
      await maybeSaveSunoFinal(
        songRow,
        payload.suno_share_url,
        $("f_is_selected_final")?.checked,
        val("f_final_suno_url")
      );
      $("pageTitle").textContent = safe(songRow.title) || "Song";
      $("msg").textContent = "Saved.";
      $("msg").className = "msg success";
    }

    $("btnCopyLyrics").onclick = () => copyText(formatSunoLyrics(val("f_lyrics")), $("btnCopyLyrics"));
    $("btnCopySuno").onclick = () => copyText(val("f_suno_prompt"), $("btnCopySuno"));
    $("btnSave").onclick = saveSong;

    if (songId) {
      await loadSong();
      await mountPackageTabs({
        songId,
        artistId: albumRow && albumRow.artist_id,
        albumId: albumRow && albumRow.id,
        personaId: songRow && songRow.persona_id
      });
    }
  </script>
</body>
</html>
